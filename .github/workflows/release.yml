name: Release

run-name: ${{ inputs.release_tag || github.event.release.tag_name }} - AppRC release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable GitHub release to send to PyPI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apprc-release-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  artifact-smoke:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Verify the uploaded bundle and smoke installed wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir packages
          gh release download "$RELEASE_TAG" --dir packages
          PYTHONPATH=src python -m apprc_dev.packaging.release_assets verify "$RELEASE_TAG" packages
          uv venv .artifact-venv
          uv pip install --python .artifact-venv/bin/python packages/*.whl
          .artifact-venv/bin/python src/apprc_dev/packaging/install_smoke.py --gui

  publish-existing-release:
    name: Publish existing GitHub Release to PyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Validate the published stable asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(just --no-dotenv --evaluate RELEASE_PYPI)" == true ]]
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          git show FETCH_HEAD:justfile > "$RUNNER_TEMP/tagged-justfile"
          [[ "$(just --no-dotenv --justfile "$RUNNER_TEMP/tagged-justfile" --evaluate RELEASE_PYPI)" == true ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft or .isPrerelease) | not' | grep -Fx true
          mkdir packages
          gh release download "$RELEASE_TAG" --dir packages
          PYTHONPATH=src python - "$RELEASE_TAG" <<'PY'
          import sys
          from pathlib import Path
          from apprc_dev.packaging.release_assets import bundle, expected_checksums
          directory = Path("packages")
          version = sys.argv[1][1:]
          if (directory / "SHA256SUMS").exists():
              bundle(directory, version)
          else:
              expected_checksums(directory, version)
          PY
          uv run --with twine --no-project -- twine check packages/*.whl packages/*.tar.gz

      - name: Publish existing artifacts to PyPI
        run: |
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/apprc-core/ packages/apprc_core-*
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/apprc/ packages/apprc-*
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/apprc-gui/ packages/apprc_gui-*
