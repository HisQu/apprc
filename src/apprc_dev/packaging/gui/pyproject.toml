[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "apprc-gui"
version = "0.27.0"
description = "Gradio configuration editor for AppRC applications."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "apprc-core==0.27.0",
    "gradio>=6.26,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
