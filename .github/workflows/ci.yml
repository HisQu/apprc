name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto

      - name: Install just
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Validate justfile
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: just --summary

      - name: Install project
        run: uv sync --locked --all-extras --group dev

      - name: Check generated terminal metadata
        run: uv run --locked python src/apprc_dev/packaging/terminal_metadata.py --check

      - name: Check lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format . --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked pyright

      - name: Test
        run: uv run --locked pytest

      - name: Compile sources
        run: uv run --locked python -m compileall -q src tests examples/example_apps/src

  gui:
    name: GUI / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto

      - name: Install core and test dependencies
        run: uv sync --locked --group dev --group gui-test

      - name: Install GUI distribution
        run: uv pip install -e src/apprc_dev/packaging/gui

      - name: Install Chromium for browser checks
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Install Chromium for browser checks
        if: matrix.os == 'windows-latest'
        run: uv run --no-sync playwright install chromium

      - name: Test GUI view and browser interaction
        env:
          TOGA_BACKEND: toga_dummy
        run: uv run --no-sync pytest src/apprc_dev/packaging/gui/tests
