[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[project]
name = "example-app"
version = "0.0.0"
description = "Repository-local example app for exercising AppRC."
requires-python = ">=3.12"
dependencies = [
    "apprc",
]

[project.scripts]
apprc = "example_app.cli:main"

[tool.uv.build-backend]
module-name = "example_app"
module-root = "src"
