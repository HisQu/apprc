# =====================================================================
# === Build backend & settings
# =====================================================================
[build-system]
requires      = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

# =====================================================================
# === Project metadata (PEP 621)
# =====================================================================

[project]
name        = "apprc"
version     = "0.19.8"
description = "Reusable runtime configuration and config CLI helpers for Python applications."
authors     = [{ name = "markur4", email = "noreply@hisqu.de" }]
readme      = { file = "README.pypi.md", content-type = "text/markdown" }
license     = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "configuration",
    "dotenv",
    "runtime-config",
    "typer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Core runtime packages only: imports needed when somebody installs and
    # uses this package with `python -m pip install -e "."`.
    "platformdirs",        # < Cross-platform user config directories
    "python-dotenv",       # < Loads .env files
    "typed-settings[dotenv]", # < Typed env/config binding
    "rich",                # < Exception rendering
    "typer",               # < Reusable config CLI builder
    # "environs",     # < Higher-level .env parsing
    # "tyro",         # < CLI from dataclasses
    # "rich",         # < Rich terminal output
    # "tqdm",         # < Progress bars
    # "numpy",        # < Numeric arrays
    # "openpyxl",     # < Excel files
]


[project.optional-dependencies]
tui = [
    "textual",             # < Terminal config editor
]


# Local-only dependency sources used by uv. These are not published as package
# requirements in AppRC wheel metadata.
[tool.uv.sources]
"apprc-example-apps" = { path = "examples/example_apps", editable = true }
# "graphigs" = { path = "../graphigs", editable = true }


[project.urls]
Homepage = "https://github.com/HisQu/apprc"
Repository = "https://github.com/HisQu/apprc"
Documentation = "https://github.com/HisQu/apprc/tree/main/docs"
Changelog = "https://github.com/HisQu/apprc/blob/main/CHANGELOG.md"
Issues = "https://github.com/HisQu/apprc/issues"

[project.scripts]
apprc = "apprc.__main__:main"


# =====================================================================
# === Local Dependency Groups
# =====================================================================

# Dependency groups are local-only development environments. Build backends do
# not publish them as package metadata, so they are the right home for pytest,
# ruff, pyright, notebooks, profiling, and docs helpers.
#
# Install commands:
#   python -m pip install -e "." --group dev
#   uv sync --locked --all-groups
[dependency-groups]
demo = [
    "apprc-example-apps",
]
dev = [
    { include-group = "demo" },
    # === Install from PyPI ===================================
    # --- Interactive development -------
    "jupyterlab",    # < Brings notebook, widgets, ipykernel, etc.
    "ipywidgets",    # < Needed for interactive widgets; also installs/configures widget frontend support.
    "textual",       # < Terminal config editor tests and manual runs.
    # "jupytext",    # < Needed for paired text notebooks / .py notebook workflows.
    # --- Testing ----------------------
    "pytest>=8.2",
    "pytest-asyncio",  # < Async testing
    "pytest-xdist",    # < Multi-core testing
    # --- Code-Quality ---------
    "pyright>=1.1",  # < Type checker
    "ruff>=0.4",  # < Linter and formatter
    # "mypy>=1.10",
    # --- Packaging ---------------------
    "twine>=6.0",  # < Validate and upload distribution metadata
    # --- Code-Optimization -------------
    "pyinstrument>=5.1",  # < Low-overhead profiling reports
    # --- Plotting -----------------------
    "graphigs @ git+https://github.com/markur4/graphigs.git"
    # "matplotlib",
    # "seaborn",
    # "plotastic",
    # --- IO -----------------------------
    # "sacred",        # < Experiment management
]

# =====================================================================
# === Packaging
# =====================================================================

[tool.uv.build-backend]
module-name = "apprc"
module-root = "src"
source-include = [
    "examples/example_apps/**",
    "src/apprc_dev/packaging/**",
    "tests/**",
]


# =====================================================================
# === Tool configurations
# =====================================================================

# -- Pylance prioritizes this over vs. code-level settings!
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"  # Enforce the minimum supported python version
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples/example_apps/src"]
extraPaths = ["src", "tests", "examples/example_apps/src"]
exclude = [
    "**/example_data",
    "**/old",
    "**/__pycache__",
    "venv", ".venv", ".direnv",
    "build", "dist", "*.egg-info",
    "**/node_modules", 
    "**/.*",
]

# Ruff (linter and formatter)
[tool.ruff]
line-length = 80
# unsafe-fixes = true


# Pytest configuration (This replaces `pytest.ini`)
[tool.pytest.ini_options]
addopts = "-n 6"  # < Use 6 cores
testpaths = ["tests"]

# ===========================
# End of file
# ===========================
