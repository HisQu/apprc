name: Release

run-name: ${{ github.actor }} - ${{ github.ref_name }} - Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: apprc-release
  cancel-in-progress: false

jobs:
  checks:
    name: Full CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto

      - name: Validate release metadata
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          python src/apprc_dev/packaging/release_notes.py \
            "$release_version" \
            --tag "$GITHUB_REF_NAME" \
            --project-version "$project_version" \
            --output release/release-notes.md

      - name: Build and validate distributions
        run: just publish-check

      - name: Check generated PyPI README
        run: git diff --exit-code -- README.pypi.md

      - name: Preserve release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/apprc/
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.ref_name }}

      - name: Publish to PyPI
        run: >-
          uv publish
          --trusted-publishing always
          --check-url https://pypi.org/simple/apprc/
          dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "AppRC ${release_version}" \
            --notes-file release/release-notes.md
