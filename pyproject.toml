# =====================================================================
# === Build backend & settings
# =====================================================================
[build-system]
requires      = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

# =====================================================================
# === Project metadata (PEP 621)
# =====================================================================
[project]
name        = "apprc"
version     = "0.8.0"
description = "Reusable runtime configuration, config CLI, and logging helpers for Python applications."
authors     = [{ name = "markur4", email = "noreply@hisqu.de" }]
readme      = { file = "README.pypi.md", content-type = "text/markdown" }
license     = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Core runtime packages only: imports needed when somebody installs and
    # uses this package with `python -m pip install -e "."`.
    "python-dotenv",       # < Loads .env files
    "typed-settings[dotenv]", # < Typed env/config binding
    "structlog",           # < Stdlib-backed structured logging
    "rich",                # < Exception rendering
    "textual",             # < Terminal config editor
    "typer",               # < Reusable config CLI builder
    # "environs",     # < Higher-level .env parsing
    # "tyro",         # < CLI from dataclasses
    # "rich",         # < Rich terminal output
    # "tqdm",         # < Progress bars
    # "numpy",        # < Numeric arrays
    # "openpyxl",     # < Excel files
]
keywords = [
    "configuration",
    "dotenv",
    "logging",
    "runtime-config",
    "typer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://hisqu.de"
Repository = "https://github.com/HisQu/apprc"
Issues = "https://github.com/HisQu/apprc/issues"

# Local-only dependency sources used by uv. These are not published as package
# requirements in AppRC wheel metadata.
[tool.uv.sources]
"apprc_example_app" = { path = "examples/apprc_example_app", editable = true }



# =====================================================================
# === Optional Feature Dependencies
# =====================================================================

# Optional dependencies are published package extras. Use them for feature
# stacks that users may want at runtime, but that should not be installed by
# default. Keep heavy feature sets here, not in [dependency-groups].
#
# Install commands:
#   python -m pip install -e ".[rag]"
#   uv sync --locked --all-extras --no-default-groups
#
# [project.optional-dependencies]
# rag = [
#     # "huggingface-hub",  # < Hugging Face model/data downloads
#     # "openai",           # < OpenAI API client
#     # "tiktoken",         # < Token counting for OpenAI-compatible models
#     # "scikit-learn",     # < Vectorizers, metrics, and classical ML helpers
#     # "torch",            # < Heavy tensor/ML runtime
# ]


# =====================================================================
# === Local Dependency Groups
# =====================================================================

# Dependency groups are local-only development environments. Build backends do
# not publish them as package metadata, so they are the right home for pytest,
# ruff, pyright, notebooks, profiling, and docs helpers.
#
# Install commands:
#   python -m pip install -e "." --group dev
#   python -m pip install -e ".[rag]" --group dev
#   uv sync --locked --all-groups
#   uv sync --locked --all-extras --all-groups
[dependency-groups]
demo = [
    "apprc_example_app",
]
dev = [
    { include-group = "demo" },
    # === Install from PyPI ===================================
    # --- Interactive development -------
    "jupyterlab",    # < Brings notebook, widgets, ipykernel, etc.
    "ipywidgets",    # < Needed for interactive widgets; also installs/configures widget frontend support.
    # "jupytext",    # < Needed for paired text notebooks / .py notebook workflows.
    # --- Testing ----------------------
    "pytest>=8.2",
    "pytest-asyncio",  # < Async testing
    "pytest-xdist",    # < Multi-core testing
    # --- Code-Quality ---------
    "pyright>=1.1",  # < Type checker
    "ruff>=0.4",  # < Linter and formatter
    # "mypy>=1.10",
    # --- Packaging ---------------------
    "twine>=6.0",  # < Validate and upload distribution metadata
    # --- Code-Optimization -------------
    "pyinstrument>=5.1",  # < Low-overhead profiling reports
    # --- Plotting -----------------------
    # "matplotlib",
    # "seaborn",
    # "plotastic",
    # --- IO -----------------------------
    # "sacred",        # < Experiment management
]

# =====================================================================
# === Packaging
# =====================================================================

[tool.uv.build-backend]
module-name = "apprc"
module-root = "src"
source-include = [
    "src/apprc_dev/packaging/**",
    "tests/**",
]


# =====================================================================
# === Tool configurations
# =====================================================================

# -- Pylance prioritizes this over vs. code-level settings!
[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"  # Enforce the minimum supported python version
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples/apprc_example_app/src"]
extraPaths = ["src", "tests", "examples/apprc_example_app/src"]
exclude = [
    "**/example_data",
    "**/old",
    "**/__pycache__",
    "venv", ".venv", ".direnv",
    "build", "dist", "*.egg-info",
    "**/node_modules", 
    "**/.*",
]

# Ruff (linter and formatter)
[tool.ruff]
line-length = 80
# unsafe-fixes = true


# Pytest configuration (This replaces `pytest.ini`)
[tool.pytest.ini_options]
addopts = "-n 6"  # < Use 6 cores
testpaths = ["tests"]

# ===========================
# End of file
# ===========================
