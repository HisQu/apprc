name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - main
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: apprc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.profile.outputs.versions }}
      extended: ${{ steps.profile.outputs.extended }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - id: profile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extended=false
          versions='["3.12"]'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$ ]]; then
              if [[ "$(just --no-dotenv --evaluate RELEASE_REQUIRE_CI)" == false ]]; then
                versions='[]'
              fi
            elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]] && \
                ! PYTHONPATH=src python -m apprc_dev.packaging.release_assets reuse-rc "$tag"; then
              extended=true
              versions='["3.12", "3.13", "3.14"]'
            fi
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "extended=$extended" >> "$GITHUB_OUTPUT"

  checks:
    needs: profile
    if: needs.profile.outputs.versions != '[]'
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version: ${{ fromJSON(needs.profile.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto

      - name: Install just
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Validate justfile
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: just --summary

      - name: Install project
        run: uv sync --all-packages --locked --all-extras --group dev --group gui-test

      - name: Check generated terminal metadata
        if: matrix.python-version == '3.12'
        run: uv run --locked python src/apprc_dev/packaging/terminal_metadata.py --check

      - name: Check lockfile
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: uv run --locked ruff format . --check

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run --locked ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run --locked pyright

      - name: Test
        run: uv run --locked pytest

      - name: Compile sources
        if: matrix.python-version == '3.12'
        run: uv run --locked python -m compileall -q src tests examples/example_apps/src

  gui:
    needs: profile
    if: needs.profile.outputs.extended == 'true'
    name: GUI / ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: auto

      - name: Install core and test dependencies
        run: uv sync --all-packages --locked --group dev --group gui-test

      - name: Install Chromium for browser checks
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Test GUI view and browser interaction
        env:
          TOGA_BACKEND: toga_dummy
        run: uv run --no-sync pytest src/apprc_dev/packaging/gui/tests
