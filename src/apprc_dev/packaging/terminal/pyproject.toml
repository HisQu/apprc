[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "apprc"
version = "0.26.0"
description = "Reusable runtime configuration and config CLI helpers for Python applications."
requires-python = ">=3.12"
license = "MIT"
keywords = ["configuration", "dotenv", "runtime-config", "typer"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Topic :: Software Development :: Libraries :: Python Modules", "Typing :: Typed"]
readme = {file = "README.md", content-type = "text/markdown"}
license-files = ["LICENSE"]
authors = [{name = "markur4", email = "noreply@hisqu.de"}]
dependencies = ["apprc-core==0.26.0", "typer", "rich", "prompt-toolkit>=3.0,<4", "textual"]

[project.urls]
Homepage = "https://github.com/HisQu/apprc"
Repository = "https://github.com/HisQu/apprc"
Documentation = "https://github.com/HisQu/apprc/tree/main/docs"
Changelog = "https://github.com/HisQu/apprc/blob/main/CHANGELOG.md"
Issues = "https://github.com/HisQu/apprc/issues"

[project.scripts]
apprc = "apprc.__main__:main"

