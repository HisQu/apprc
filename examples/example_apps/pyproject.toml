[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "apprc-example-apps"
version = "0.0.0"
description = "Repository-local example CLIs for AppRC integration workflows."
requires-python = ">=3.12"
dependencies = [
    "apprc",
]

[project.scripts]
apprc-config-only = "config_only.cli:main"
apprc-config-with-storage = "config_with_storage.cli:main"
apprc-explicit-env-precedence = "explicit_env_precedence.cli:main"
apprc-cli-runtime = "cli_runtime.cli:main"
apprc-examples-run-all = "_example_apps_utils.run_all:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "cli_runtime*",
    "config_only*",
    "_example_apps_utils",
    "explicit_env_precedence*",
    "config_with_storage*",
]

[tool.setuptools.package-data]
"*" = ["apprc.defaults.env"]
